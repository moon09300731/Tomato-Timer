# Pomodoro Timer Website Nginx Configuration
# 番茄钟应用网站Nginx配置
# 配置说明：此文件定义Pomodoro Timer宣传网站的服务器配置

server {
    # 监听80端口（HTTP标准端口）
    # 由于macOS系统限制，80端口需要sudo权限或使用端口转发
    listen 80;
    server_name localhost;
    
    # 网站根目录 - 指向pomodoro-website文件夹
    root /Users/liangxinyu/Desktop/番茄钟/pomodoro-website;
    
    # 默认索引文件
    index index.html;
    
    # 访问日志设置
    access_log /opt/homebrew/var/log/nginx/pomodoro-access.log;
    error_log /opt/homebrew/var/log/nginx/pomodoro-error.log;
    
    # 客户端最大body大小限制（用于文件上传等场景）
    client_max_body_size 10M;
    
    # 启用gzip压缩，提升传输性能
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    
    # 跨域资源共享(CORS)设置
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    
    # 安全相关头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 缓存控制 - 静态资源缓存策略
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 主路径配置
    location / {
        # 尝试访问文件，如果不存在则返回index.html（支持前端路由）
        try_files $uri $uri/ /index.html;
        
        # 设置默认字符集
        charset utf-8;
        
        # 禁用iframes嵌入
        add_header X-Frame-Options "DENY";
    }
    
    # API代理示例（预留接口）
    # location /api/ {
    #     proxy_pass http://localhost:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    
    # 静态文件服务优化
    location ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 错误页面配置
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /Users/liangxinyu/Desktop/番茄钟/pomodoro-website;
        internal;
    }
}

