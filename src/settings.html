<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        const { ipcRenderer } = require('electron');
        
        let workMinutes = 25;
        let breakMinutes = 5;
        let extensionMinutes = 5;
        
        function loadSettings() {
            workMinutes = localStorage.getItem('workMinutes') || 25;
            breakMinutes = localStorage.getItem('breakMinutes') || 5;
            extensionMinutes = localStorage.getItem('extensionMinutes') || 5;
            document.getElementById('work-duration').value = workMinutes;
            document.getElementById('break-duration').value = breakMinutes;
            document.getElementById('extension-duration').value = extensionMinutes;
        }
        
        function saveSettings() {
            workMinutes = document.getElementById('work-duration').value;
            breakMinutes = document.getElementById('break-duration').value;
            extensionMinutes = document.getElementById('extension-duration').value;
            localStorage.setItem('workMinutes', workMinutes);
            localStorage.setItem('breakMinutes', breakMinutes);
            localStorage.setItem('extensionMinutes', extensionMinutes);
            ipcRenderer.send('settings-saved');
            ipcRenderer.send('close-settings');
        }
        
        function cancelSettings() {
            ipcRenderer.send('close-settings');
        }
        
        function updateTheme(isDark) {
            document.body.className = isDark ? 'dark' : 'light';
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            document.getElementById('save-btn').addEventListener('click', saveSettings);
            document.getElementById('cancel-btn').addEventListener('click', cancelSettings);
            
            const isDark = ipcRenderer.sendSync('get-theme');
            updateTheme(isDark);
            
            ipcRenderer.on('theme-changed', (event, isDark) => {
                updateTheme(isDark);
            });
        });
    </script>
    <style>
        .settings-container {
            width: 100%;
            height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .settings-header {
            margin-bottom: 10px;
        }
        
        .settings-header h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin: 0;
        }
        
        .settings-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--text-secondary);
        }
        
        .setting-label {
            font-size: 16px;
            color: var(--text-primary);
        }
        
        .setting-input {
            width: 80px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--text-secondary);
            background-color: var(--background-primary);
            color: var(--text-primary);
            text-align: center;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .setting-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .settings-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }
        
        .settings-btn {
            padding: 10px 24px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .settings-btn:hover {
            transform: translateY(-2px);
        }
        
        .settings-btn:active {
            transform: translateY(0);
        }
        
        .save-btn {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }
        
        .save-btn:hover {
            box-shadow: 0 6px 16px rgba(255, 107, 107, 0.4);
        }
        
        .cancel-btn {
            background-color: transparent;
            border: 2px solid var(--text-secondary);
            color: var(--text-primary);
        }
        
        .cancel-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
    </style>
</head>
<body class="light">
    <div class="settings-container">
        <div class="settings-header">
            <h2>番茄钟设置</h2>
        </div>
        <div class="settings-content">
            <div class="setting-item">
                <span class="setting-label">工作时间（分钟）</span>
                <input type="number" id="work-duration" class="setting-input" min="1" max="60" value="25">
            </div>
            <div class="setting-item">
                <span class="setting-label">休息时间（分钟）</span>
                <input type="number" id="break-duration" class="setting-input" min="1" max="60" value="5">
            </div>
            <div class="setting-item">
                <span class="setting-label">延长时间（分钟）</span>
                <input type="number" id="extension-duration" class="setting-input" min="1" max="30" value="5">
            </div>
        </div>
        <div class="settings-footer">
            <button id="cancel-btn" class="settings-btn cancel-btn">取消</button>
            <button id="save-btn" class="settings-btn save-btn">保存</button>
        </div>
    </div>
</body>
</html>
