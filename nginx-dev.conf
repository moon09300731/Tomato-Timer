# Nginx Development Configuration for Pomodoro Timer Website
# 番茄钟应用网站Nginx开发环境配置

# 运行nginx的用户（设置为当前用户）
user liangxinyu staff;

# 工作进程数（设置为CPU核心数）
worker_processes  auto;

# 错误日志路径（使用项目目录）
error_log  /Users/liangxinyu/Desktop/番茄钟/nginx-logs/error.log;

# PID文件路径（使用项目目录）
pid        /Users/liangxinyu/Desktop/番茄钟/nginx-logs/nginx.pid;

# 事件模块配置
events {
    # 每个工作进程的最大连接数
    worker_connections  1024;
    
    # 使用epoll事件模型（Linux）或kqueue（macOS）
    use kqueue;
    
    # 多连接接受模式
    multi_accept on;
}

# HTTP模块配置
http {
    # 临时文件路径（避免权限问题）
    client_body_temp_path /Users/liangxinyu/Desktop/番茄钟/nginx-logs/temp/client_body;
    proxy_temp_path /Users/liangxinyu/Desktop/番茄钟/nginx-logs/temp/proxy;
    fastcgi_temp_path /Users/liangxinyu/Desktop/番茄钟/nginx-logs/temp/fastcgi;
    uwsgi_temp_path /Users/liangxinyu/Desktop/番茄钟/nginx-logs/temp/uwsgi;
    scgi_temp_path /Users/liangxinyu/Desktop/番茄钟/nginx-logs/temp/scgi;

    # MIME类型配置
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # 日志格式定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    # 访问日志路径
    access_log  /Users/liangxinyu/Desktop/番茄钟/nginx-logs/access.log main;
    
    # 文件传输优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    
    # 连接超时设置
    keepalive_timeout  65;
    
    # 客户端超时设置
    client_header_timeout 60;
    client_body_timeout 60;
    send_timeout 60;
    
    # 启用gzip压缩
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
    gzip_disable "MSIE [1-6]\.";
    
    # 服务器配置
    server {
        # 监听8080端口（开发环境）
        listen 8080;
        server_name localhost;
        
        # 网站根目录
        root /Users/liangxinyu/Desktop/番茄钟/pomodoro-website;
        
        # 默认索引文件
        index index.html;
        
        # 客户端最大body大小限制（10MB）
        client_max_body_size 10M;
        
        # 客户端header缓冲区大小
        client_header_buffer_size 4k;
        large_client_header_buffers 4 16k;
        
        # 跨域资源共享(CORS)设置
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Max-Age' 86400 always;
        
        # 安全相关HTTP头部
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;
        
        # 静态资源缓存策略
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Pragma public;
            add_header ETag "";
            access_log off;
        }
        
        # 字体文件缓存策略
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
        }
        
        # 主路径配置 - 支持前端路由
        location / {
            # 支持HTML5 History模式的前端路由
            try_files $uri $uri/ /index.html;
            
            # 设置字符集
            charset utf-8;
            
            # 禁用iframes嵌入
            add_header X-Frame-Options "DENY";
            
            # 禁止目录列表
            autoindex off;
        }
        
        # 办公文档文件缓存
        location ~* \.(pdf|doc|docx|xls|xlsx|ppt|pptx|zip|rar|tar|gz|bz2|7z)$ {
            expires 30d;
            add_header Cache-Control "public";
            add_header Content-Disposition "attachment";
        }
        
        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        # 禁止访问敏感文件
        location ~* (\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }
        
        # 自定义错误页面
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
        
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /Users/liangxinyu/Desktop/番茄钟/pomodoro-website;
            internal;
        }
        
        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # 状态监控端点（开发环境使用）
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
    
    # HTTPS配置块（预留，用于后续启用HTTPS）
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #     
    #     # SSL证书路径（需要替换为实际证书路径）
